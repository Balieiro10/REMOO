<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Inteligente de Notas Fiscais</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    .status-ok { background-color: #10B981; color: white; }
    .status-pending { background-color: #F59E0B; color: white; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Cabeçalho -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-2 rounded-lg"><i class="fa-solid font-bold text-xl fa-receipt"></i></div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Controle de Notas</h1>
          <p class="text-xs text-slate-400 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
            <span>Sincronizado ao vivo</span>
          </p>
        </div>
      </div>
      <button onclick="toggleRoomModal()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-2">
        <i class="fa-solid fa-users text-indigo-400"></i>
        <span id="current-room-label">Sala: PRINCIPAL</span>
      </button>
    </div>
  </header>

  <!-- Painel Principal -->
  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">
    <!-- Cards de Totais -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase">Total em Notas</p>
          <h3 id="stat-total-value" class="text-2xl font-black text-slate-900 mt-1">R$ 0,00</h3>
        </div>
        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-wallet"></i></div>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase">Qtd de Notas</p>
          <h3 id="stat-total-count" class="text-2xl font-black text-slate-900 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-file-invoice"></i></div>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase">Pendências</p>
          <h3 id="stat-pending-count" class="text-2xl font-black text-amber-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
      </div>
    </div>

    <!-- Botões de Ação -->
    <div class="flex flex-wrap gap-3 items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl shadow-sm transition flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Nova Nota Fiscal
      </button>
      <div class="flex gap-2 w-full sm:w-auto">
        <button onclick="exportToPDF()" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-file-pdf text-red-400"></i> PDF pro Gestor
        </button>
        <button onclick="confirmResetMonth()" class="bg-red-50 hover:bg-red-100 text-red-600 text-sm font-semibold px-4 py-2.5 rounded-xl border border-red-200 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-trash-can"></i> Resetar Mês
        </button>
      </div>
    </div>

    <!-- Lista de Notas -->
    <div id="invoices-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

  <!-- Modal Adicionar Nota -->
  <div id="add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b">
        <h3 class="font-bold text-slate-800 text-lg">Adicionar Nota</h3>
        <button onclick="closeAddModal()"><i class="fa-solid fa-xmark text-xl text-slate-400"></i></button>
      </div>
      <form id="invoice-form" onsubmit="handleFormSubmit(event)" class="space-y-4 mt-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Foto da Nota</label>
          <input type="file" id="photo-input" accept="image/*" capture="environment" onchange="processImage(event)" class="w-full text-xs">
          <img id="photo-preview" class="hidden max-h-32 mt-2 rounded border">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1">Nº NF (sem zeros)</label>
            <input type="text" id="nf-number" required placeholder="1234" class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Valor Total (R$)</label>
            <input type="number" step="0.01" id="nf-value" required placeholder="0.00" class="w-full border rounded p-2 text-sm">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Fornecedor</label>
          <input type="text" id="nf-supplier" required placeholder="Nome do Fornecedor" class="w-full border rounded p-2 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Data de Entrada</label>
          <input type="date" id="nf-date" required class="w-full border rounded p-2 text-sm">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeAddModal()" class="w-1/2 py-2 text-slate-600 font-semibold text-sm">Cancelar</button>
          <button type="submit" class="w-1/2 bg-indigo-600 text-white font-semibold text-sm py-2 rounded-xl">Salvar Nota</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Configuração do Banco em Tempo Real
    const firebaseConfig = { databaseURL: "https://controle-notas-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoom = localStorage.getItem('invoice_room') || 'PRINCIPAL';
    let invoices = {};
    let currentPhotoBase64 = '';

    // Escutar atualizações ao vivo do outro celular
    function listenRealtimeData() {
      db.ref('rooms/' + currentRoom).on('value', (snapshot) => {
        invoices = snapshot.val() || {};
        renderInvoices();
        updateStats();
      });
    }
    listenRealtimeData();

    // Processar Foto
    function processImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        currentPhotoBase64 = evt.target.result;
        document.getElementById('photo-preview').src = currentPhotoBase64;
        document.getElementById('photo-preview').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    // Salvar e Enviar
    function handleFormSubmit(e) {
      e.preventDefault();
      const rawNf = document.getElementById('nf-number').value.trim();
      const cleanNf = rawNf.replace(/^0+/, '') || '0'; // Remove zeros à esquerda automaticamente

      const newInvoice = {
        id: Date.now().toString(),
        number: cleanNf,
        value: parseFloat(document.getElementById('nf-value').value) || 0,
        supplier: document.getElementById('nf-supplier').value.trim(),
        date: document.getElementById('nf-date').value,
        photo: currentPhotoBase64,
        vmarket: 'PENDENTE',
        everloja: 'PENDENTE',
        createdAt: new Date().toISOString()
      };

      db.ref(`rooms/${currentRoom}/${newInvoice.id}`).set(newInvoice);
      closeAddModal();
    }

    // Alternar Botões de Liberação
    function toggleStatus(id, type) {
      if (!invoices[id]) return;
      const newStatus = invoices[id][type] === 'OK' ? 'PENDENTE' : 'OK';
      db.ref(`rooms/${currentRoom}/${id}/${type}`).set(newStatus);
    }

    // Renderizar Lista na Tela
    function renderInvoices() {
      const container = document.getElementById('invoices-container');
      const list = Object.values(invoices);
      if (list.length === 0) {
        container.innerHTML = `<p class="col-span-2 text-center text-slate-400 py-8">Nenhuma nota cadastrada nesta sala.</p>`;
        return;
      }
      container.innerHTML = list.map(item => `
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
          <div class="flex justify-between items-start">
            <div class="flex gap-3">
              ${item.photo ? `<img src="${item.photo}" class="w-12 h-12 object-cover rounded-lg border">` : ''}
              <div>
                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">NF nº ${item.number}</span>
                <h4 class="font-bold text-slate-800 text-sm mt-1">${item.supplier}</h4>
                <p class="text-xs text-slate-400">Data: ${item.date ? item.date.split('-').reverse().join('/') : '-'}</p>
              </div>
            </div>
            <p class="font-black text-slate-900">R$ ${item.value.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t">
            <button onclick="toggleStatus('${item.id}', 'vmarket')" class="py-2 rounded-xl font-bold text-xs ${item.vmarket === 'OK' ? 'status-ok' : 'bg-slate-100 text-slate-500'}">VMARKET: ${item.vmarket}</button>
            <button onclick="toggleStatus('${item.id}', 'everloja')" class="py-2 rounded-xl font-bold text-xs ${item.everloja === 'OK' ? 'status-ok' : 'bg-slate-100 text-slate-500'}">EVERLOJA: ${item.everloja}</button>
          </div>
        </div>
      `).join('');
    }

    // Atualizar Totais
    function updateStats() {
      const list = Object.values(invoices);
      const totalVal = list.reduce((acc, curr) => acc + (curr.value || 0), 0);
      const pendingCount = list.filter(i => i.vmarket !== 'OK' || i.everloja !== 'OK').length;
      document.getElementById('stat-total-value').innerText = `R$ ${totalVal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
      document.getElementById('stat-total-count').innerText = list.length;
      document.getElementById('stat-pending-count').innerText = pendingCount;
    }

    // Gerar PDF para Gestor
    function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(14);
      doc.text(`RELATÓRIO DE NOTAS FISCAIS - SALA: ${currentRoom}`, 14, 15);
      
      const list = Object.values(invoices);
      const totalVal = list.reduce((acc, curr) => acc + (curr.value || 0), 0);
      doc.setFontSize(10);
      doc.text(`Total de Notas: ${list.length} | Valor Acumulado: R$ ${totalVal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`, 14, 22);

      const tableData = list.map(i => [
        i.number,
        i.supplier,
        i.date ? i.date.split('-').reverse().join('/') : '-',
        `R$ ${i.value.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`,
        `VMARKET: ${i.vmarket}\nEVERLOJA: ${i.everloja}`
      ]);

      doc.autoTable({
        head: [['Nº NF', 'Fornecedor', 'Data Entrada', 'Valor', 'Status Lojas']],
        body: tableData,
        startY: 28,
        headStyles: { fillColor: [79, 70, 229] }
      });

      doc.save(`Relatorio_Notas_${currentRoom}.pdf`);
    }

    // Resetar Mês
    function confirmResetMonth() {
      if (confirm(`Deseja apagar todas as notas da Sala ${currentRoom}?`)) db.ref(`rooms/${currentRoom}`).remove();
    }

    // Modais
    function openAddModal() { 
      document.getElementById('invoice-form').reset();
      document.getElementById('photo-preview').classList.add('hidden');
      document.getElementById('add-modal').classList.remove('hidden'); 
    }
    function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }
    function toggleRoomModal() {
      const room = prompt("Digite o código da sala para sincronizar os aparelhos:", currentRoom);
      if (room) {
        currentRoom = room.toUpperCase().trim();
        localStorage.setItem('invoice_room', currentRoom);
        document.getElementById('current-room-label').innerText = `Sala: ${currentRoom}`;
        listenRealtimeData();
      }
    }
  </script>
</body>
</html>
